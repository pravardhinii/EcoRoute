app:
  carbon:
    max-allowed-emissions: 5000.0
    default-standard: ISO-14083

spring:
  datasource:
    url: jdbc:h2:mem:ecoroutedb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true